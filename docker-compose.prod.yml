version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zentstay_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zentstay_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zentstay_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-zentstay_prod}
    ports:
      - "5432:5432"
    volumes:
      - zentstay_prod_pg_data:/var/lib/postgresql/data
    networks:
      - zentstay_prod_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zentstay_admin} -d ${POSTGRES_DB:-zentstay_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zentstay_prod_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - zentstay_prod_redis_data:/data
    networks:
      - zentstay_prod_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zentstay_prod_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zentstay_admin}:${POSTGRES_PASSWORD:-zentstay_secure_password_2026}@postgres:5432/${POSTGRES_DB:-zentstay_prod}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-zentstay_prod_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-zentstay_prod_refresh_secret_2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zentstay_prod_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zentstay_prod_frontend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - zentstay_prod_net

volumes:
  zentstay_prod_pg_data:
  zentstay_prod_redis_data:

networks:
  zentstay_prod_net:
    driver: bridge
