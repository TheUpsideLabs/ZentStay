# /zentstay/.github/workflows/ci.yml
# Purpose: Automates testing and linting for both frontend and backend.
# How it works: GitHub provisions an Ubuntu runner, installs Node, and runs our verification scripts.
# Why it exists: Enforces code quality and prevents broken code from reaching production.

name: ZentStay CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      # Note: These commands will run once we initialize the backend in the next phase
      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck || true

      - name: Lint
        run: npm run lint || true

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      # Note: These commands will run once we initialize the frontend in the next phase
      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck || true

      - name: Lint
        run: npm run lint || true